<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Buscador de CEP - Consulte endereços completos por CEP de forma rápida e gratuita usando a API ViaCEP.">
    <link rel="stylesheet" href="style.css">
    <title>Buscador de CEP</title>
</head>
<body>
    <main>
        <h1 id="logo">Buscador de CEP</h1>
        <form>
            <label for="cep">CEP:</label>
            <input type="text"
            id="cep"
            name="cep"
            placeholder="Digite seu CEP"
            maxlength="9"
            required
            autocomplete="postal-code"
            inputmode="numeric"
            pattern="\d{5}-?\d{3}"
            aria-describedby="cepHelp"
            />
            <small id="cepHelp">Digite apenas números. Formato: 00000-000</small>
            <div class="button-group">
                <button type="submit" name="submit" aria-label="Consultar CEP">Consultar</button>
                <button type="button" id="clearBtn" name="clear" aria-label="Limpar busca">Limpar</button>
            </div>
        </form>
        <section class="center">
            <div id="result" role="status" aria-live="polite"></div>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
